[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "django-realtime-search"
version = "0.1.0"
description = "Filter Django admin changelists in realtime as you type in the search box."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
dependencies = ["Django>=3.2,<5.0"]
classifiers = [
    "Framework :: Django",
    "Framework :: Django :: 3.2",
    "Framework :: Django :: 4.0",
    "Framework :: Django :: 4.1",
    "Framework :: Django :: 4.2",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
test = ["playwright"]

[tool.setuptools.packages.find]
include = ["realtime_search*"]

[tool.setuptools.package-data]
realtime_search = ["templates/admin/*.html", "static/realtime_search/*"]
